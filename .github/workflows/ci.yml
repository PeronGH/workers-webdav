name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p . && bunx tsc --noEmit -p test
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test --run
